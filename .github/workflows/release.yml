name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win -- --x64 --publish never
            artifact: windows-x64
          - name: macOS Universal
            os: macos-15
            command: npm run dist:mac -- --universal --publish never
            artifact: macos-universal

    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERTIFICATE: ${{ secrets.CSC_LINK != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}

      - name: Build signed macOS installer
        if: runner.os == 'macOS' && env.HAS_MAC_CERTIFICATE == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: ${{ matrix.command }}

      - name: Build unsigned macOS installer
        if: runner.os == 'macOS' && env.HAS_MAC_CERTIFICATE != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
